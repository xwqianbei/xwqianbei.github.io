        // Nav scroll effect
        let lastScroll = 0;
        const nav = document.getElementById('mainNav');
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            if (currentScroll > 60) {
                nav.classList.add('scrolled');

            }
            lastScroll = currentScroll;
        });
